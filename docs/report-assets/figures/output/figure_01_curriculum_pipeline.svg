<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:bold}.label{font-size:18px}.small{font-size:14px}.note{font-size:13px;fill:#4d5c70}.axis{stroke:#45576d;stroke-width:2}.grid{stroke:#d5dce5;stroke-width:1}</style>
<rect width="1500" height="900" fill="white"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#31445f"/></marker></defs>
<text x="70" y="70" class="title">Figure 1. Curriculum, frozen selection, and package verification</text>
<text x="70" y="100" class="note">Solid: recorded evidence. Dashed: planned or incomplete stage. Model families remain separate in Tasks 1 and 2.</text>
<rect x="80" y="250" width="210" height="110" rx="10" fill="#dcecff" stroke="#31445f" stroke-width="2"/>
<text x="185.0" y="297.0" text-anchor="middle" class="label">Task 1 — Cold start</text>
<rect x="360" y="250" width="210" height="110" rx="10" fill="#e4f5e8" stroke="#31445f" stroke-width="2"/>
<text x="465.0" y="297.0" text-anchor="middle" class="label">Task 2 — Warm start</text>
<rect x="640" y="250" width="210" height="110" rx="10" fill="#fff1c9" stroke="#31445f" stroke-width="2"/>
<text x="745.0" y="297.0" text-anchor="middle" class="label">Task 3 — Paired validation</text>
<rect x="920" y="250" width="210" height="110" rx="10" fill="#f9dce0" stroke="#31445f" stroke-width="2"/>
<text x="1025.0" y="297.0" text-anchor="middle" class="label">Task 4 — Strong opponents</text>
<rect x="1200" y="250" width="210" height="110" rx="10" fill="#e9e2ff" stroke="#31445f" stroke-width="2"/>
<text x="1305.0" y="297.0" text-anchor="middle" class="label">Package / submission check</text>
<path d="M 290 305 L 360 305" stroke="#31445f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M 570 305 L 640 305" stroke="#31445f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M 850 305 L 920 305" stroke="#31445f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M 1130 305 L 1200 305" stroke="#31445f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="360" y="530" width="210" height="110" rx="10" fill="#fff" stroke="#31445f" stroke-width="2" stroke-dasharray="8 6"/>
<text x="465.0" y="577.0" text-anchor="middle" class="label">Development checkpoint selection</text>
<rect x="640" y="530" width="210" height="110" rx="10" fill="#fff" stroke="#31445f" stroke-width="2" stroke-dasharray="8 6"/>
<text x="745.0" y="577.0" text-anchor="middle" class="label">Confirmation / main validation</text>
<path d="M 465 360 L 465 530" stroke="#31445f" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
<path d="M 745 360 L 745 530" stroke="#31445f" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
<text x="80" y="740" class="label">Observed evidence:</text>
<text x="110" y="780" class="small">Q-learning and distilled CNN: Task 1 independent confirmations recorded.</text>
<text x="110" y="810" class="small">Task 3 seed22/c150: 100-world paired main validation. Task 4: bounded attempts and historical B33 benchmark are separate protocols.</text>
<text x="110" y="850" class="note">No line asserts every planned Task 4 stage or reserved final-test set was run.</text>
</svg>